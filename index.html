<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chris &amp; Shannon’s Dashboard</title>
<style>
:root{--card:rgba(255,248,236,.94);--ink:#2b1d14;--mute:#6e5a4a;--acc:#b4441b;--line:#ead8c0}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:linear-gradient(135deg,#7a2e12 0%,#b4441b 30%,#d9822b 55%,#c99a2e 72%,#5a3418 100%) fixed;color:var(--ink);min-height:100vh}
header,main{position:relative;z-index:1}h1{color:#fff7e8;text-shadow:0 2px 6px #0006}header p{color:#ffe9c7!important}
.leaves{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}.leaves svg{position:absolute;top:-60px;opacity:.55;animation:fall linear infinite}
@keyframes fall{0%{transform:translate(0,-60px) rotate(0)}50%{transform:translate(40px,50vh) rotate(180deg)}100%{transform:translate(-20px,110vh) rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.leaves svg{animation:none;top:auto}}
.card h2{color:#9a3412}.card{border:1px solid #f0d9b5}a:hover{color:#7c2d12}
header{padding:24px 20px 8px;max-width:1200px;margin:auto}h1{margin:0;font-size:24px}header p{margin:4px 0 0;color:var(--mute)}
main{max-width:1200px;margin:auto;padding:12px 20px 40px;display:grid;gap:18px;grid-template-columns:1fr 1fr;align-items:start}@media(max-width:800px){main{grid-template-columns:1fr}}
.card{background:var(--card);border-radius:16px;padding:18px 20px;box-shadow:0 2px 6px #3a180833,0 10px 30px #3a180840;backdrop-filter:blur(3px)}
.card h2{margin:0 0 4px;font-size:18px}.sub{color:var(--mute);font-size:13px;margin-bottom:12px}
.deals{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.deal{border:1px solid var(--line);border-radius:12px;padding:12px}.deal b{display:block}.ret{font-size:12px;color:#fff;background:var(--acc);border-radius:99px;padding:1px 8px;display:inline-block;margin:4px 0}
.deal ul{margin:6px 0;padding-left:18px}.promo{font-size:13px;color:#2f7a3d}.na{color:#b33}.small{font-size:12px;color:var(--mute)}a{color:var(--acc)}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line)}th{color:var(--mute);font-weight:600}
.empty{text-align:center;color:var(--mute);padding:18px;border:1px dashed var(--line);border-radius:10px;margin-top:8px}
.wrap{overflow-x:auto}.more{margin-top:8px;font-size:13px}#fun table{table-layout:fixed}#fun td:nth-child(1),#fun th:nth-child(1){width:26%}#fun td:nth-child(2),#fun th:nth-child(2){width:24%}#fun td:nth-child(3),#fun th:nth-child(3){width:27%}.more summary{cursor:pointer;color:var(--acc)}
</style></head><body><div class="leaves" aria-hidden="true"></div><header><h1>Chris &amp; Shannon’s Dashboard</h1><p id="meta"></p></header>
<main><section class="card" id="deals"></section><section class="card" id="bills"></section><section class="card" id="groceries"></section><section class="card" id="reservations"></section><section class="card" id="fun" style="grid-column:1/-1"></section></main>
<script id="data" type="application/json">{"user": {"name": "Christopher", "location": "Brick, NJ", "tz": "America/New_York"}, "deals": {"as_of": "2026-10-13 10:53 AM ET", "items": [{"name": "KAYALI Vanilla | 28 EDP", "retailer": "KAYALI US", "url": "https://us.kayali.com/products/vanilla-28", "kayali_handle": "vanilla-28", "prices": {"100ml": "$150.00", "50ml": "$105.00", "10ml Miniature": "$32.00", "10ml Travel Spray": "$29.00", "1.5ml": "$4.00"}, "promo": "Subscribe to the newsletter and get 10% off your first order.", "as_of": "2026-10-13 10:53 AM ET"}, {"name": "KAYALI Vanilla | 28 EDP", "retailer": "Sephora", "url": "https://www.sephora.com/product/kayali-vanilla-P439406", "prices": {"100ml": "$150.00", "50ml": "$105.00", "10ml Travel Spray": "$29.00"}, "promo": "5% off with Auto-Replenish ($142.50 / $99.75 / $27.55)", "as_of": "2026-10-13 09:50 AM ET", "note": "From search-indexed Sephora page; direct fetch blocked"}, {"name": "KAYALI Vanilla Candy Rock Sugar | 42", "retailer": "KAYALI US", "url": "https://us.kayali.com/products/vanilla-candy-rock-sugar-42", "kayali_handle": "vanilla-candy-rock-sugar-42", "prices": {"100ml": "$150.00", "50ml": "$105.00", "10ml Miniature": "$32.00", "10ml Travel Spray": "$29.00", "1.5ml": "$4.00"}, "promo": "Subscribe to the newsletter and get 10% off your first order.", "as_of": "2026-10-13 10:53 AM ET"}, {"name": "KAYALI Utopia Vanilla Coco | 21", "retailer": "KAYALI US", "url": "https://us.kayali.com/products/utopia-vanilla-coco-21", "kayali_handle": "utopia-vanilla-coco-21", "prices": {"100ml": "$150.00", "50ml": "$105.00", "10ml Miniature": "$32.00", "1.5ml": "$4.00"}, "promo": "Subscribe to the newsletter and get 10% off your first order.", "as_of": "2026-10-13 10:53 AM ET"}, {"name": "Burberry Goddess Amber Vanilla EDP Intense", "retailer": "Ulta", "url": "https://www.ulta.com/p/goddess-amber-vanilla-eau-de-parfum-intense-with-maple-syrup-amber-pimprod2060253", "prices": {"range (4 sizes)": "$38.00 \u2013 $192.00"}, "promo": "Free gift with purchase (no code shown)", "as_of": "2026-10-13 09:48 AM ET"}, {"name": "Burberry Goddess EDP (Vanilla & Lavender)", "retailer": "Ulta", "url": "https://www.ulta.com/p/burberry-goddess-eau-de-parfum-with-vanilla-lavender-pimprod2040465", "prices": {"range (5 sizes)": "$40.00 \u2013 $185.00"}, "promo": "Free gift with purchase (no code shown)", "as_of": "2026-10-13 09:48 AM ET"}, {"name": "KAYALI Vanilla | 28 EDP", "retailer": "Ulta", "url": "https://www.ulta.com/search?search=kayali+vanilla", "prices": "not available", "promo": "", "as_of": "2026-10-13 09:48 AM ET", "note": "Not carried at Ulta"}]}, "bills": {"source": "Household Bills bot", "columns": ["Bill", "Amount", "Due date", "Autopay/Manual", "Who pays", "Paid?"], "rows": []}, "groceries": {"source": "Groceries bot", "note": "Pescatarian-friendly", "items": []}, "reservations": {"source": "Dinner Reservations bot", "columns": ["Restaurant", "Date/Time", "Party size", "Platform"], "items": [["Charlie's of Bay Head", "Sat Dec 5, 2026, 8:30 PM ET", "2", "Booked by you"]]}, "fun_things": {"source": "Fun Things To Do bot", "as_of": "2026-10-13 10:40 AM ET", "items": [{"name": "Boo at the Boardwalk (Jenkinson's)", "datetime": "Sat\u2013Sun Oct 17\u201318 & 24\u201325, 2026 \u00b7 12\u20134 PM", "place": "Jenkinson's Boardwalk, 300 Ocean Ave, Point Pleasant Beach", "price": "Free to attend; half-price rides; $29.95 Boo-Tastic package (in person)", "link": "https://jenkinsons.com/booattheboardwalk/"}, {"name": "Fall Fest at Laurita Winery", "datetime": "Sat Oct 24 (also Sun Oct 25), 2026 \u00b7 from 12 PM", "place": "Laurita Winery, 85 Archertown Rd, Plumsted", "price": "$15 online (until 6 PM day before), $20 after/at door; under 21 free", "link": "https://www.exploretock.com/lauritawinery/event/623034"}, {"name": "Halloween Bingo Family Fun Night (CLCL Foundation)", "datetime": "Sat Oct 24, 2026 \u00b7 1\u20133 PM", "place": "Brick Teen Center, 270 Chambers Bridge Rd, Brick", "price": "Free", "link": "https://clclfoundation.org/event/halloween-bingo-an-october-free-family-fun-night/"}, {"name": "Brick Township Trunk or Treat", "datetime": "Thu Oct 22, 2026 \u00b7 time not listed", "place": "Drum Point Sports Complex, Brick", "price": "not listed", "link": "https://patch.com/new-jersey/brick/trunks-wanted-bricks-trunk-or-treat-event"}]}}</script>
<script>
(()=>{const L=document.querySelector('.leaves'),C=['#e8a33d','#c2410c','#9a3412','#d97706','#7c2d12','#f2c14e'],R=matchMedia('(prefers-reduced-motion: reduce)').matches;
for(let i=0;i<16;i++){const s=18+Math.random()*22,c=C[i%C.length];const v=`<svg width="${s}" height="${s}" viewBox="0 0 24 24" style="left:${Math.random()*100}%;${R?`top:${Math.random()*95}%;transform:rotate(${Math.random()*360}deg)`:`animation-duration:${14+Math.random()*16}s;animation-delay:-${Math.random()*30}s`}"><path fill="${c}" d="M12 2l2 4 4-1-1 4 4 2-4 2 2 4-4-1-1 4-2-3-2 3-1-4-4 1 2-4-4-2 4-2-1-4 4 1z"/><path stroke="#5a3418" stroke-width=".8" d="M12 8v14"/></svg>`;L.insertAdjacentHTML('beforeend',v)}})();
const D=JSON.parse(document.getElementById('data').textContent),e=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function load(){try{const r=await fetch('data.json',{cache:'no-store'});if(r.ok)return await r.json()}catch(x){}return D}
const empty=(src,what)=>`<div class="empty">No ${what} yet — the <b>${e(src)}</b> fills this in.</div>`;
load().then(d=>{
document.getElementById('meta').textContent=`${d.user.location} · ${d.user.tz}`;
const g=d.deals,num=v=>{const m=String(v).match(/\$([\d,.]+)/);return m?parseFloat(m[1].replace(/,/g,'')):1e9};
const short=p=>{if(!p)return'';const pc=(p.match(/\d+%/)||[''])[0];if(/newsletter/i.test(p))return pc+' off w/ signup';if(/replenish/i.test(p))return pc+' off Auto-Replenish';if(/gift/i.test(p))return'Free gift';return p.length>28?p.slice(0,26)+'…':p};
const best=i=>{if(typeof i.prices==='string')return null;const k=Object.keys(i.prices),k1=k.find(x=>/^100\s*ml/i.test(x))||k[0];return{size:k1,val:i.prices[k1],n:num(i.prices[k1])}};
const groups={};g.items.forEach(i=>(groups[i.name]=groups[i.name]||[]).push(i));
const rows=Object.entries(groups).map(([n,its])=>{const c=its.map(i=>({i,b:best(i)})).filter(x=>x.b).sort((x,y)=>x.b.n-y.b.n);return{n,its,top:c[0]}});
const row=r=>{const t=r.top;if(!t)return`<tr><td>${e(r.n)}</td><td colspan="2" class="na">not available</td></tr>`;const sz=/^100\s*ml/i.test(t.b.size)?'':` <span class="small">(${e(t.b.size.replace(/\s*\(.*\)/,''))})</span>`;return`<tr><td>${e(r.n)}</td><td style="white-space:nowrap"><b>${e(t.b.val)}</b>${sz} · <a href="${e(t.i.url)}" target="_blank" rel="noopener">${e(t.i.retailer)}</a></td><td class="promo" style="white-space:nowrap">${e(short(t.i.promo))}</td></tr>`};
const det=rows.map(r=>`<div class="small" style="margin-top:6px"><b style="color:var(--ink)">${e(r.n)}</b>`+r.its.map(i=>`<br>${e(i.retailer)}: ${typeof i.prices==='string'?e(i.prices):Object.entries(i.prices).map(([k,v])=>e(k)+' '+e(v)).join(' · ')}${i.promo?' — '+e(i.promo):''}${i.note?' ('+e(i.note)+')':''} <a href="${e(i.url)}" target="_blank" rel="noopener">↗</a>`).join('')+'</div>').join('');
document.getElementById('deals').innerHTML=`<h2>🍂 Deals — Vanilla scents</h2><div class="sub">Best 100ml price · as of ${e(g.as_of)}</div><div class="wrap"><table><thead><tr><th>Product</th><th>Best</th><th>Promo</th></tr></thead><tbody>${rows.slice(0,2).map(row).join('')}</tbody></table></div><details class="more"><summary>more${rows.length>2?` (+${rows.length-2} products)`:''} · all sizes & retailers</summary>${rows.length>2?`<table><tbody>${rows.slice(2).map(row).join('')}</tbody></table>`:''}${det}</details>`;
const tbl=(cols,rows,src,what)=>`<div class="wrap"><table><thead><tr>${cols.map(c=>`<th>${e(c)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${e(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>${rows.length?'':empty(src,what)}`;
const b=d.bills;document.getElementById('bills').innerHTML=`<h2>🧾 Bills</h2><div class="sub">Monthly household bills (shared)</div>`+tbl(b.columns,b.rows,b.source,'bills');
const gr=d.groceries;document.getElementById('groceries').innerHTML=`<h2>🛒 Grocery list</h2><div class="sub">${e(gr.note)}</div>`+(gr.items.length?gr.items.map(i=>`<label style="display:block"><input type="checkbox" ${i.done?'checked':''}> ${e(i.name||i)}</label>`).join(''):empty(gr.source,'items'));
const rv=d.reservations;document.getElementById('reservations').innerHTML=`<h2>🍽️ Reservations</h2><div class="sub">Upcoming dinner reservations</div>`+tbl(rv.columns,rv.items,rv.source,'reservations');
const f=d.fun_things||{items:[],source:'Fun Things To Do bot'},fr=i=>`<tr><td><a href="${e(i.link)}" target="_blank" rel="noopener">${e(i.name)}</a></td><td>${e(i.datetime||'not listed')}</td><td>${e(i.place||'not listed')}</td><td>${e(i.price||'not listed')}</td></tr>`,fh='<thead><tr><th>Event</th><th>When</th><th>Where</th><th>Price</th></tr></thead>';
document.getElementById('fun').innerHTML=`<h2>🎃 Fun Things To Do</h2><div class="sub">Near Brick / Jersey Shore · filled in by the ${e(f.source)}${f.as_of?' · as of '+e(f.as_of):''}</div>`+(f.items.length?`<div class="wrap"><table>${fh}<tbody>${f.items.slice(0,2).map(fr).join('')}</tbody></table></div>`+(f.items.length>2?`<details class="more"><summary>more (+${f.items.length-2})</summary><div class="wrap"><table><tbody>${f.items.slice(2).map(fr).join('')}</tbody></table></div></details>`:''):empty(f.source,'events'));
});
</script></body></html>
