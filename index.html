<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Christopher's Dashboard</title>
<style>
:root{--bg:#f4f5f8;--card:#fff;--ink:#1d2433;--mute:#6b7385;--acc:#8a5a2b;--line:#e7e9ef}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{padding:24px 20px 8px;max-width:1200px;margin:auto}h1{margin:0;font-size:24px}header p{margin:4px 0 0;color:var(--mute)}
main{max-width:1200px;margin:auto;padding:12px 20px 40px;display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.card{background:var(--card);border-radius:16px;padding:18px 20px;box-shadow:0 1px 3px #0001,0 6px 20px #0000000a}
.card h2{margin:0 0 4px;font-size:18px}.sub{color:var(--mute);font-size:13px;margin-bottom:12px}
#deals{grid-column:1/-1}.deals{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.deal{border:1px solid var(--line);border-radius:12px;padding:12px}.deal b{display:block}.ret{font-size:12px;color:#fff;background:var(--acc);border-radius:99px;padding:1px 8px;display:inline-block;margin:4px 0}
.deal ul{margin:6px 0;padding-left:18px}.promo{font-size:13px;color:#2f7a3d}.na{color:#b33}.small{font-size:12px;color:var(--mute)}a{color:var(--acc)}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line)}th{color:var(--mute);font-weight:600}
.empty{text-align:center;color:var(--mute);padding:18px;border:1px dashed var(--line);border-radius:10px;margin-top:8px}
.wrap{overflow-x:auto}
</style></head><body><header><h1>Christopher's Dashboard</h1><p id="meta"></p></header>
<main><section class="card" id="deals"></section><section class="card" id="bills"></section><section class="card" id="groceries"></section><section class="card" id="reservations"></section></main>

omo": "Free gift with purchase (no code shown)", "as_of": "2026-10-13 09:48 AM ET"}, {"name": "Burberry Goddess EDP (Vanilla & Lavender)", "retailer": "Ulta", "url": "https://www.ulta.com/p/burberry-goddess-eau-de-parfum-with-vanilla-lavender-pimprod2040465", "prices": {"range (5 sizes)": "$40.00 \u2013 $185.00"}, "promo": "Free gift with purchase (no code shown)", "as_of": "2026-10-13 09:48 AM ET"}, {"name": "KAYALI Vanilla | 28 EDP", "retailer": "Ulta", "url": "https://www.ulta.com/search?search=kayali+vanilla", "prices": "not available", "promo": "", "as_of": "2026-10-13 09:48 AM ET", "note": "Not carried at Ulta"}]}, "bills": {"source": "Household Bills bot", "columns": ["Bill", "Amount", "Due date", "Autopay/Manual", "Who pays", "Paid?"], "rows": []}, "groceries": {"source": "Groceries bot", "note": "Pescatarian-friendly", "items": []}, "reservations": {"source": "Dinner Reservations bot", "columns": ["Restaurant", "Date/Time", "Party size", "Platform"], "items": []}}</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent),e=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function load(){try{const r=await fetch('data.json',{cache:'no-store'});if(r.ok)return await r.json()}catch(x){}return D}
const empty=(src,what)=>`<div class="empty">No ${what} yet — the <b>${e(src)}</b> fills this in.</div>`;
load().then(d=>{
document.getElementById('meta').textContent=`${d.user.location} · ${d.user.tz}`;
const g=d.deals;document.getElementById('deals').innerHTML=`<h2>🍦 Deals — Vanilla scents</h2><div class="sub">Kayali Vanilla | 28 & similar · as of ${e(g.as_of)}</div><div class="deals">`+g.items.map(i=>`<div class="deal"><b>${e(i.name)}</b><span class="ret">${e(i.retailer)}</span>${typeof i.prices==='string'?`<div class="na">${e(i.prices)}</div>`:'<ul>'+Object.entries(i.prices).map(([k,v])=>`<li>${e(k)}: <b style="display:inline">${e(v)}</b></li>`).join('')+'</ul>'}${i.promo?`<div class="promo">🏷 ${e(i.promo)}</div>`:''}${i.note?`<div class="small">${e(i.note)}</div>`:''}<div class="small">as of ${e(i.as_of)} · <a href="${e(i.url)}" target="_blank" rel="noopener">source</a></div></div>`).join('')+'</div>';
const tbl=(cols,rows,src,what)=>`<div class="wrap"><table><thead><tr>${cols.map(c=>`<th>${e(c)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${e(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>${rows.length?'':empty(src,what)}`;
const b=d.bills;document.getElementById('bills').innerHTML=`<h2>💡 Bills</h2><div class="sub">Monthly household bills (shared)</div>`+tbl(b.columns,b.rows,b.source,'bills');
const gr=d.groceries;document.getElementById('groceries').innerHTML=`<h2>🛒 Grocery list</h2><div class="sub">${e(gr.note)}</div>`+(gr.items.length?gr.items.map(i=>`<label style="display:block"><input type="checkbox" ${i.done?'checked':''}> ${e(i.name||i)}</label>`).join(''):empty(gr.source,'items'));
const rv=d.reservations;document.getElementById('reservations').innerHTML=`<h2>🍽 Reservations</h2><div class="sub">Upcoming dinner reservations</div>`+tbl(rv.columns,rv.items,rv.source,'reservations');
});
</script></body></html>
